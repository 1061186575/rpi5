<!doctype html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>rpi control center</title>
    <style>
        :root {
            --pageBackground: #f4f7fb;
            --panelBackground: #ffffff;
            --primaryColor: #2563eb;
            --primaryHoverColor: #1d4ed8;
            --successColor: #16a34a;
            --dangerColor: #dc2626;
            --textColor: #172033;
            --secondaryTextColor: #64748b;
            --borderColor: #e2e8f0;
            --shadowColor: rgba(15, 23, 42, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            color: var(--textColor);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--pageBackground);
        }

        .pageShell {
            width: min(1180px, 100%);
            margin: 0 auto;
        }

        .topBar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 24px;
        }

        .pageTitle {
            margin: 0 0 6px;
            font-size: 28px;
            line-height: 1.2;
        }

        .updateTime {
            color: var(--secondaryTextColor);
            font-size: 14px;
        }

        .headerActions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel {
            margin-bottom: 20px;
            padding: 20px;
            overflow: hidden;
            border: 1px solid var(--borderColor);
            border-radius: 14px;
            background: var(--panelBackground);
            box-shadow: 0 8px 24px var(--shadowColor);
        }

        .panelTitle {
            margin: 0 0 16px;
            font-size: 18px;
        }

        .metricGrid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .metricCard {
            padding: 18px 20px;
            border: 1px solid var(--borderColor);
            border-radius: 14px;
            background: linear-gradient(135deg, #ffffff, #f8fbff);
            box-shadow: 0 6px 20px var(--shadowColor);
        }

        .metricLabel {
            display: block;
            margin-bottom: 8px;
            color: var(--secondaryTextColor);
            font-size: 13px;
        }

        .metricValue {
            font-size: 24px;
            font-weight: 700;
        }

        .tableWrap {
            overflow: hidden;
            border: 1px solid var(--borderColor);
            border-radius: 10px;
        }

        .table {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .row {
            display: flex;
            min-height: 58px;
            border-bottom: 1px solid var(--borderColor);
            transition: background-color 0.2s ease;
        }

        #tableRowList .row:hover {
            background: #f8fafc;
        }

        .tableHeader {
            min-height: 48px;
            color: #475569;
            font-size: 13px;
            font-weight: 700;
            background: #f8fafc;
        }

        .cell {
            flex: 0.7;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
            padding: 12px;
            text-align: center;
        }

        .cell:first-child {
            flex: 2;
            justify-content: flex-start;
            overflow-wrap: anywhere;
            text-align: left;
            word-break: break-word;
        }

        .row:last-child {
            border-bottom: none;
        }

        .statusBadge {
            display: inline-flex;
            align-items: center;
            min-width: 74px;
            padding: 5px 10px;
            justify-content: center;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .statusOnline {
            color: #15803d;
            background: #dcfce7;
        }

        .statusOffline {
            color: #b91c1c;
            background: #fee2e2;
        }

        button {
            min-height: 36px;
            padding: 7px 14px;
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            background: var(--primaryColor);
            cursor: pointer;
            transition: transform 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
        }

        button:hover {
            background: var(--primaryHoverColor);
            box-shadow: 0 5px 12px rgba(37, 99, 235, 0.2);
            transform: translateY(-1px);
        }

        .buttonDanger {
            background: var(--dangerColor);
        }

        .buttonDanger:hover {
            background: #b91c1c;
            box-shadow: 0 5px 12px rgba(220, 38, 38, 0.2);
        }

        .buttonSuccess {
            background: var(--successColor);
        }

        .buttonSuccess:hover {
            background: #15803d;
            box-shadow: 0 5px 12px rgba(22, 163, 74, 0.2);
        }

        .logoutLink {
            display: inline-flex;
            align-items: center;
            min-height: 36px;
            padding: 7px 14px;
            border: 1px solid var(--borderColor);
            border-radius: 8px;
            color: #475569;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            background: #ffffff;
        }

        .logoutLink:hover {
            color: var(--dangerColor);
            border-color: #fecaca;
            background: #fff7f7;
        }

        .commandList {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        #runStatus {
            overflow: auto;
            border-radius: 10px;
            color: #dbeafe;
            background: #0f172a;
        }

        #runStatus pre {
            min-width: max-content;
            margin: 0;
            padding: 16px;
            font-size: 13px;
            line-height: 1.55;
        }

        .emptyText {
            color: #94a3b8;
        }

        @media (max-width: 640px) {
            body {
                padding: 16px 12px;
            }

            .topBar {
                align-items: flex-start;
                flex-direction: column;
            }

            .pageTitle {
                font-size: 24px;
            }

            .metricGrid {
                /*grid-template-columns: 1fr;*/
            }

            .panel {
                padding: 16px;
                border-radius: 12px;
            }

            .cell {
                padding: 10px 6px;
                font-size: 13px;
            }

            .cell:first-child {
                flex: 1.6;
            }

            .cell button {
                min-height: 32px;
                padding: 6px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

<main class="pageShell">
    <header class="topBar">
        <div>
            <h1 class="pageTitle">RPI 控制中心</h1>
            <div class="updateTime">最后更新：<span id="statusChangeTime">--</span></div>
        </div>
        <div class="headerActions">
            <button onclick="getData()">刷新状态</button>
            <a class="logoutLink" href="/logout">退出</a>
        </div>
    </header>

    <div id="cpuInfo" class="metricGrid"></div>

    <section class="panel">
        <h2 class="panelTitle">项目管理</h2>
        <div class="tableWrap">
            <div class="table">
                <div class="row tableHeader">
                    <div class="cell">名称</div>
                    <div class="cell">状态</div>
                    <div class="cell">操作</div>
                    <div class="cell">查看</div>
                </div>
                <div id="tableRowList"></div>
            </div>
        </div>
    </section>

    <section class="panel">
        <h2 class="panelTitle">快捷命令</h2>
        <div id="quickCmd" class="commandList"></div>
    </section>

    <section class="panel">
        <h2 class="panelTitle">PM2 运行状态</h2>
        <div id="runStatus"></div>
    </section>
</main>


<script>
  var quickCmd = document.getElementById('quickCmd')
  var runStatus = document.getElementById('runStatus')
  var tableRowList = document.getElementById('tableRowList')
  var cpuInfo = document.getElementById('cpuInfo')
  var statusChangeTime = document.getElementById('statusChangeTime')
  var mainProjectName = 'rpi'
  var portMap = {}

  function getData() {
    fetch('/runStatus')
      .then(res => res.json())
      .then(res => {
        if (res.code === 0) {
          const data = res.data;

          portMap = data.portMap || {};

          const cpuEle = `<div class="metricCard"><span class="metricLabel">CPU 使用率</span><strong class="metricValue">${data.cpuUsage}</strong></div>`
          const cpuTempEle = `<div class="metricCard"><span class="metricLabel">CPU 温度</span><strong class="metricValue">${data.cpuTemp}</strong></div>`
          cpuInfo.innerHTML = cpuEle + cpuTempEle

          statusChangeTime.innerHTML = new Date(data.statusChangeTime).toLocaleString();

          runStatus.innerHTML = `<pre>${data.pm2List}</pre>`

          quickCmd.innerHTML = data.quickCmdList.map(d => `
            <button class="${d.command === 'sudo shutdown -h now' ? 'buttonDanger' : ''}" onclick="runCmd('${d.command}')">${d.name}</button>
          `).join('')

          const pm2Status = data.pm2Status || [];
          tableRowList.innerHTML = pm2Status.map(d => {
            const hasPort = portMap[d.name] !== null && portMap[d.name] !== undefined
            return `
    <div class="row">
        <div class="cell">${d.name}</div>
        <div class="cell"><span class="statusBadge ${d.status === 'online' ? 'statusOnline' : 'statusOffline'}">${d.status}</span></div>
        <div class="cell">
            <button class="${d.status === 'online' ? 'buttonDanger' : 'buttonSuccess'}" onclick="startOrStop('${d.name}', '${d.status}')">${d.status === 'online' ? '关闭' : '启动'}</button>
        </div>
        <div class="cell">
            ${hasPort ? `<button onclick="goto('${d.name}')">进入</button>` : '<span class="emptyText">--</span>'}
        </div>
    </div>
        `
          }).join('')
        }
      })
  }

  function goto(name) {
    const port = portMap[name]
    if (port === null || port === undefined) {
      alert(`没有获取到${name}的端口`)
      return
    }
    const targetUrl = new URL(window.location.href)
    targetUrl.port = port
    targetUrl.pathname = '/'
    targetUrl.search = ''
    targetUrl.hash = ''
    open(targetUrl.toString())
  }

  function startOrStop(name, status) {
    if (name === mainProjectName) {
      if (!confirm('确定关闭当前项目?')) {
        return
      }
    }
    fetch(`/pm2StartOrStop?name=${name}&status=${status}`)
      .then(res => res.json())
      .then(res => {
        if (res.code === 0) {
          getData()
        } else {
          alert('接口出错')
        }
      })
  }

  function runCmd(cmd) {
    if (cmd === 'sudo shutdown -h now') {
      if (!confirm('确定关机')) {
        return
      }
    }
    fetch('/runCmd?cmd=' + encodeURIComponent(cmd))
      .then(res => res.json())
      .then(res => {
        if (res.code === 0) {
          getData()
        } else {
          const msg = res.data.msg;
          alert(msg)
        }
      }).catch(err => {
      console.log('err', err)
      if (err.message === 'Failed to fetch') {
        location.reload();
      }
    })
  }

  function main() {
    getData();
  }

  main()

</script>

</body>
</html>
