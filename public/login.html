<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录</title>
    <style>
        .container {
            margin: 30px auto;
        }
        .container > * {
            font-size: 18px;
            margin: 5px;
        }
    </style>

</head>
<body>

<div class="container">
    <input id="user" class="input" placeholder="用户名" autofocus>
    <input id="password" class="input" type="password" placeholder="密码">
    <button id="submit" class="button">验证</button>
</div>

<script>
  submit.onclick = function login() {
    fetch(`/login`, {
      method: 'POST',
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        user: user.value,
        password: password.value,
      })
    }).then(res => res.json()).then(res => {
      console.log('res', res)
      if (res.code === 0) {
        location.href = '/'
      } else {
        alert(res.msg)
      }
    })
  }
</script>

</body>
</html>
